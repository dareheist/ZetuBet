<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZetuCash Admin Review</title><style>body{font:15px system-ui;margin:0;background:#f4f6fb;color:#182033}main{max-width:1000px;margin:auto;padding:20px}h1{font-size:24px}.bar,.item{background:white;border:1px solid #dfe4ee;border-radius:12px;padding:14px;margin:12px 0}.bar{display:flex;gap:8px;flex-wrap:wrap}input,button,select{font:inherit;padding:10px;border:1px solid #ccd3e1;border-radius:8px}input{min-width:220px;flex:1}button{cursor:pointer;background:#0b8d6b;color:white;border:0}.reject{background:#c7354a}.item h3{margin:0 0 8px}.item pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px system-ui}.row{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#626d81;font-size:13px}#status{white-space:pre-wrap;color:#9c2d3e}</style></head><body><main><h1>ZetuCash Admin Review</h1><p class="muted">Restricted API dashboard. Use the ADMIN_REVIEW_TOKEN configured on the server. The token is held in this page's memory only and is not saved to localStorage.</p><section class="bar"><input id="token" type="password" autocomplete="off" placeholder="Admin review token"><select id="kind"><option value="loans">Loan requests</option><option value="kyc">Identity / KYC applications</option></select><button id="load">Load pending items</button></section><p id="status" role="status"></p><div id="items"></div></main><script>
(()=>{const $=id=>document.getElementById(id);let records=[];const headers=()=>({'Content-Type':'application/json','x-admin-review-token':$('token').value});async function request(url,opts={}){const r=await fetch(url,{...opts,headers:{...headers(),...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}function render(list,kind){records=list;$('items').innerHTML='';if(!list.length){$('items').textContent='No pending items found.';return}list.forEach((item,i)=>{const box=document.createElement('section');box.className='item';const title=document.createElement('h3');title.textContent=(kind==='kyc'?'KYC application #':'Loan request #')+(item.id??i+1);const pre=document.createElement('pre');pre.textContent=JSON.stringify(item,null,2);const row=document.createElement('div');row.className='row';['approved','rejected'].forEach(status=>{const b=document.createElement('button');b.textContent=status==='approved'?'Approve':'Reject';if(status==='rejected')b.className='reject';b.onclick=async()=>{const note=status==='rejected'?prompt('Reason for rejection (optional):')||'':'';try{const endpoint=kind==='kyc'?`/api/admin/loan-applications/${encodeURIComponent(item.id)}/review`:`/api/admin/loan-requests/${encodeURIComponent(item.id)}/review`;const payload=kind==='kyc'?{status:status==='approved'?'verified':'rejected',note}:{status,note};await request(endpoint,{method:'POST',body:JSON.stringify(payload)});$('status').textContent='Review saved by backend.';await load()}catch(e){$('status').textContent=e.message}};row.append(b)});box.append(title,pre,row);$('items').append(box)})}async function load(){const kind=$('kind').value;$('status').textContent='Loading…';$('items').innerHTML='';try{const d=kind==='kyc'?await request('/api/admin/loan-applications/pending'):await request('/api/admin/loan-requests?status=pending');const list=Array.isArray(d)?d:(d.items||d.applications||d.requests||[]);render(list,kind);$('status').textContent=`Loaded ${list.length} record(s).`}catch(e){$('status').textContent=e.message}}$('load').onclick=load})()
</script></body></html>
